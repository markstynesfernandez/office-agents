<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e9e4dc'/%3E%3Crect x='7' y='9' width='18' height='4' rx='2' fill='%23c7a4d6'/%3E%3Crect x='7' y='15' width='18' height='4' rx='2' fill='%238fb5d6'/%3E%3Crect x='7' y='21' width='18' height='4' rx='2' fill='%23a9cfa6'/%3E%3C/svg%3E">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body data-theme="light">
<div id="app">
  <header id="topbar">
    <span class="tb-brand"><span class="tb-dot"></span><span id="station-name">Station</span></span>
    <span id="source-badge" class="badge badge-muted">loading</span>
    <span id="synthetic-badge" class="badge badge-syn hidden">synthetic states</span>
    <span id="demo-badge" class="badge badge-demo hidden" title="Demo mode: the real engine on the mock provider, with a scripted day on its own data root (data-demo/). Nothing here is real station data; no model is called and nothing is charged.">DEMO · simulated data</span>
    <button id="demo-ctl" class="badge badge-muted demo-ctl hidden" title="demo: Space pause/resume · 1 2 4 speed · R restart"></button>
    <span class="tb-sep"></span>
    <span id="services" class="tb-services"></span>
    <span class="tb-fill"></span>
    <span id="spend-today" class="tb-spend"></span>
    <span class="tb-sep"></span>
    <button id="estop" class="btn-estop hidden" title="E-stop: abort every model and image call now">E-STOP</button>
    <span id="clock" class="tb-clock">--:--</span>
    <button id="theme-toggle" class="btn-icon" title="dark mode (D)">◐</button>
  </header>

  <main id="stage">
    <canvas id="scene"></canvas>
    <div id="labels"></div>
    <div id="scene-controls">
      <button id="zoom-in" class="btn-icon" title="zoom in (+)">+</button>
      <button id="zoom-out" class="btn-icon" title="zoom out (−)">−</button>
      <button id="reset-view" class="btn-icon" title="reset view (R)">⌂</button>
    </div>
    <div id="warnings" class="warnings hidden"></div>
    <div id="perf" class="perf hidden"></div>
    <div id="caption" class="caption hidden" aria-live="polite"></div>
  </main>

  <aside id="taskpanel">
    <section class="tp-new">
      <div class="tp-head"><span>New task</span><span class="badge badge-preview">preview · not connected</span></div>
      <select id="task-dept"></select>
      <textarea id="task-input" rows="3" placeholder="Describe a task for this department… (v1: nothing is sent)"></textarea>
      <div class="tp-row"><label class="chk"><input type="checkbox" checked disabled> needs my OK</label><button id="task-submit" class="btn" disabled>Create (disabled in v1)</button></div>
    </section>
    <section class="tp-filters">
      <div class="tp-head"><span>Tasks</span><span class="scope"><button class="chip chip-on" data-scope="office">whole office</button><button class="chip" data-scope="dept">this department</button></span></div>
      <div id="task-filters" class="filters"></div>
    </section>
    <section id="task-list" class="tp-list"></section>
  </aside>

  <aside id="sidepanel" class="hidden"><div id="sidepanel-body"></div></aside>

  <section id="board" class="overlay hidden"><div class="overlay-head"><h2>Board</h2><span class="muted">jobs by stage · Esc to close</span></div><div id="board-body"></div></section>
  <section id="calendar" class="overlay hidden"><div id="calendar-body"></div></section>
  <section id="ledger" class="overlay hidden"><div class="overlay-head"><h2>Station memory</h2><span class="muted">notebooks + ledger · Esc to close</span></div><div id="ledger-body"></div></section>

  <footer id="hints"><span><b>B</b> board</span><span><b>C</b> calendar</span><span><b>T</b> today</span><span><b>←↑↓→</b> move</span><span><b>+ −</b> zoom</span><span id="hint-reset"><b>R</b> reset</span><span id="hint-demo" class="hidden"><b>Space</b> pause <b>1 2 4</b> speed <b>R</b> restart</span><span><b>P</b> presenter</span><span><b>D</b> dark</span><span><b>F</b> fps</span><span><b>Esc</b> close</span><span id="hint-status" class="muted"></span></footer>
</div>
<script type="module" src="/main.js"></script>
</body>
</html>
